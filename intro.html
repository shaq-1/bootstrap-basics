<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-success display-1">Welcome to my site</h1>
    <p class="lead">my name is jane</p>
    <p class="text-end">hello this is bootstrap</p>
    <p class="text-center">this is centered text</p>
    <p class="text-start">this is text allinged to start</p>
    <p class="fw-bold">this is bold text</p>
    <p class="fw-normal text-uppercase">this is normal text</p>
    <p class="fw-light">this is light text</p>
    <p class="fw-semibold">this is semibold text</p>
    <p class="fst-italic text-capitalize">italized text</p>
    <p class="text-decoration-underline">underline</p>
    <p class="text-decoration-line-through">linethrough</p>
    <ul class="list-unstyled list-inline">
        <li class="list-inline-item">html</li>
        <li class="list-inline-item">css</li>
        <li class="list-inline-item">bootstrap</li>
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
